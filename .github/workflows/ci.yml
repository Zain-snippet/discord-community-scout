name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --all-targets

      - name: Tests
        run: cargo test --locked

      - name: Health smoke test
        run: |
          mkdir -p data
          ./target/debug/discord-community-scout &
          server_pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'; then
              echo "health endpoint OK"
              kill $server_pid
              exit 0
            fi
            sleep 1
          done
          echo "health endpoint did not come up"
          kill $server_pid || true
          exit 1

  deployment-assets:
    name: deployment config
    runs-on: ubuntu-latest
    env:
      SITE_ADDRESS: ci.invalid
      ACME_EMAIL: ci@example.com
      BASIC_AUTH_USER: ci
      # bcrypt hash of the throwaway password "ci-only-password".
      # This is a test fixture, not a credential used anywhere.
      BASIC_AUTH_HASH: "$2a$14$tPPXpQ1lu4HettTjSz.lj.3o5PyQxNtv5HAUONMfVTWZk2ZhC1Dgy"
      DUCKDNS_SUBDOMAIN: ci-scout
      DUCKDNS_TOKEN: ci-not-a-real-token
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done

      - name: Compose config (default and DuckDNS profiles)
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml --profile duckdns config --quiet

      - name: Caddyfile
        run: |
          docker run --rm \
            -e SITE_ADDRESS -e ACME_EMAIL -e BASIC_AUTH_USER -e BASIC_AUTH_HASH \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  arm64-image:
    name: arm64 image (Oracle VM target)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image for arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: discord-community-scout:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it and prove SQLite persistence across a restart
        run: |
          mkdir -p ci-data
          docker run -d --name scout-ci \
            -e PORT=8080 \
            -e 'DATABASE_URL=sqlite:///app/data/scout.db?mode=rwc' \
            -v "$PWD/ci-data:/app/data" \
            -p 8080:8080 \
            discord-community-scout:ci

          wait_for_health() {
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          if ! wait_for_health; then
            echo "container did not become healthy"
            docker logs scout-ci
            docker rm -f scout-ci
            exit 1
          fi
          echo "health endpoint OK"

          curl -fsS -X POST http://127.0.0.1:8080/api/communities \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI persistence test","description":"created by CI","tags":["ci"]}' \
            | grep -q '"name":"CI persistence test"'
          echo "record created"

          docker restart scout-ci
          if ! wait_for_health; then
            echo "container did not come back healthy"
            docker logs scout-ci
            docker rm -f scout-ci
            exit 1
          fi

          curl -fsS 'http://127.0.0.1:8080/api/communities?q=CI%20persistence' \
            | grep -q '"name":"CI persistence test"'
          echo "record survived restart"

          docker rm -f scout-ci
          sudo rm -rf ci-data
